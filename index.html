<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#F5EFE0}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;direction:rtl}
#root{max-width:480px;margin:0 auto;min-height:100vh}
.screen{padding-bottom:80px;min-height:100vh}
.opp-card{transition:transform 0.15s,box-shadow 0.15s;cursor:pointer}
.opp-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(28,20,16,0.12)!important}
input:focus,select:focus{border-color:#C4956A!important;outline:none}
select{-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#C4956A44;border-radius:4px}
a{text-decoration:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1410;color:#fff;padding:10px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;animation:fadeup 0.25s ease;white-space:nowrap}
@keyframes fadeup{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#FDFAF4;border-radius:20px;padding:24px;width:100%;max-width:340px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const SB_URL = "https://bmgngnfcbczczhggzial.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZ25nbmZjYmN6Y3poZ2d6aWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MDg5MTUsImV4cCI6MjA5NTA4NDkxNX0.Y1_mpBuUD0bjBSGcI4Yget2N-YYEwbSF-1UoYU867uQ";
const sb = supabase.createClient(SB_URL, SB_KEY);

async function dbGet(id){
  const {data,error}=await sb.from("opportunities").select("data").eq("id",id).single();
  if(error||!data) return null;
  return data.data;
}
async function dbCreate(opp){
  const {error}=await sb.from("opportunities").insert({id:opp.id,data:opp});
  if(error) throw error;
}
async function dbUpdate(opp){
  const {error}=await sb.from("opportunities").update({data:opp}).eq("id",opp.id);
  if(error) throw error;
}
async function dbList(ids){
  if(!ids||!ids.length) return [];
  const {data,error}=await sb.from("opportunities").select("data").in("id",ids);
  if(error||!data) return [];
  return data.map(r=>r.data);
}

const LS={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const KEYS={RESTS:"s_rests",NAMES:"s_names",REST_ITEMS:"s_rest_items",MY_IDS:"s_my_ids",MY_OPPS_PIN:"s_opps_pin"};

const uid=()=>Math.random().toString(36).slice(2,10);
const fmtTime=d=>new Date(d).toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"});
const fmtDate=d=>new Date(d).toLocaleDateString("ar-SA",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
const getUrlId=()=>new URLSearchParams(window.location.search).get("opp");
const setUrlId=id=>{const u=new URL(window.location.href);u.searchParams.set("opp",id);window.history.replaceState({},"",u.toString());};
const clearUrl=()=>window.history.replaceState({},"",window.location.pathname);
const pageUrl=id=>window.location.origin+window.location.pathname+"?opp="+id;

// Save items per restaurant
function getRestItems(restaurant){
  const all=LS.get(KEYS.REST_ITEMS)||{};
  return all[restaurant]||[];
}
function saveRestItem(restaurant,itemName){
  const all=LS.get(KEYS.REST_ITEMS)||{};
  const cur=all[restaurant]||[];
  if(!cur.includes(itemName)){
    all[restaurant]=[itemName,...cur].slice(0,50);
    LS.set(KEYS.REST_ITEMS,all);
  }
}

// PIN helpers — store {oppId: pin}
function saveOppPin(oppId,pin){
  const m=LS.get(KEYS.MY_OPPS_PIN)||{};
  m[oppId]=pin;
  LS.set(KEYS.MY_OPPS_PIN,m);
}
function getOppPin(oppId){
  const m=LS.get(KEYS.MY_OPPS_PIN)||{};
  return m[oppId]||null;
}
function amICreator(oppId){
  return !!getOppPin(oppId);
}

const CLAY="#C4956A",DARK="#1C1410",CARD="#FDFAF4",BORDER="#E8DCC8",ACCENT="#8B5E3C",GREEN="#2D7A4F",WA="#25D366";
const sp={viewBox:"0 0 24 24",fill:"none",stroke:"currentColor"};
const Ico={
  plus:  <svg {...sp} strokeWidth="2.5" width="18" height="18"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
  share: <svg {...sp} strokeWidth="2" width="18" height="18"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>,
  rcpt:  <svg {...sp} strokeWidth="2" width="18" height="18"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>,
  lock:  <svg {...sp} strokeWidth="2" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>,
  back:  <svg {...sp} strokeWidth="2" width="20" height="20"><polyline points="15 18 9 12 15 6"/></svg>,
  trash: <svg {...sp} strokeWidth="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>,
  chk:   <svg {...sp} strokeWidth="2.5" width="16" height="16"><polyline points="20 6 9 17 4 12"/></svg>,
  clock: <svg {...sp} strokeWidth="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  rest:  <svg {...sp} strokeWidth="2" width="16" height="16"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>,
  usr:   <svg {...sp} strokeWidth="2" width="16" height="16"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
};

const inp={width:"100%",padding:"11px 14px",borderRadius:12,border:"1.5px solid #E8DCC8",background:CARD,fontSize:14,color:DARK,outline:"none",boxSizing:"border-box",fontFamily:"inherit",direction:"rtl",transition:"border-color 0.15s"};

function TopBar({onBack,title,sub,right}){
  return(
    <div style={{background:DARK,padding:"16px",display:"flex",alignItems:"center",gap:12}}>
      <button onClick={onBack} style={{background:"rgba(255,255,255,0.1)",border:"none",borderRadius:10,padding:8,cursor:"pointer",color:"#fff",display:"flex",alignItems:"center",flexShrink:0}}>{Ico.back}</button>
      <div style={{flex:1,minWidth:0}}>
        <h2 style={{fontSize:17,fontWeight:700,color:"#fff",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{title}</h2>
        {sub&&<div style={{fontSize:12,color:"rgba(255,255,255,0.5)",marginTop:2}}>{sub}</div>}
      </div>
      {right}
    </div>
  );
}
function Field({label,children}){
  return <div style={{marginBottom:18}}><div style={{fontSize:13,fontWeight:600,color:ACCENT,marginBottom:6}}>{label}</div>{children}</div>;
}
function Btn({onClick,disabled,loading,children,color,style={}}){
  const bg=disabled||loading?"#ccc":(color||DARK);
  return(
    <button onClick={onClick} disabled={disabled||loading}
      style={{width:"100%",padding:"14px",background:bg,color:"#fff",border:"none",borderRadius:14,fontSize:15,fontWeight:700,cursor:(disabled||loading)?"not-allowed":"pointer",marginTop:8,fontFamily:"inherit",boxShadow:(disabled||loading)?"none":"0 4px 12px rgba(28,20,16,0.18)",display:"flex",alignItems:"center",justifyContent:"center",gap:8,...style}}>
      {loading?<span className="spin"/>:children}
    </button>
  );
}
function Toast({msg}){return <div className="toast">{msg}</div>;}
function Loading(){
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"60vh",gap:16}}>
      <span className="spin" style={{width:32,height:32,borderWidth:3,borderColor:"rgba(196,149,106,0.3)",borderTopColor:CLAY}}/>
      <p style={{color:ACCENT,fontSize:14,margin:0}}>جاري التحميل...</p>
    </div>
  );
}

// ── PIN Modal ─────────────────────────────────────────────────────────────
function PinModal({title,onConfirm,onCancel,error}){
  const [pin,setPin]=useState("");
  return(
    <div className="modal-bg">
      <div className="modal">
        <div style={{fontSize:16,fontWeight:700,color:DARK,marginBottom:6}}>{title}</div>
        <div style={{fontSize:13,color:"#888",marginBottom:16}}>أدخل الرمز الذي اخترته عند إنشاء الفرصة</div>
        <input style={{...inp,letterSpacing:8,textAlign:"center",fontSize:20}} type="password" maxLength={6} placeholder="••••" value={pin} onChange={e=>setPin(e.target.value)}/>
        {error&&<div style={{fontSize:12,color:"#e55",marginTop:6,textAlign:"center"}}>{error}</div>}
        <Btn onClick={()=>onConfirm(pin)} disabled={!pin}>تأكيد</Btn>
        <button onClick={onCancel} style={{width:"100%",marginTop:8,padding:"10px",background:"none",border:"none",color:"#aaa",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>إلغاء</button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("loading");
  const [opp,setOpp]      =useState(null);
  const [myOpps,setMyOpps]=useState([]);
  const [rests,setRests]  =useState(()=>LS.get(KEYS.RESTS)||[]);
  const [names,setNames]  =useState(()=>LS.get(KEYS.NAMES)||[]);
  const [now,setNow]      =useState(new Date());
  const [toast,setToast]  =useState(null);
  const toastRef          =useRef(null);

  useEffect(()=>{
    const init=async()=>{
      const id=getUrlId();
      if(id){
        const data=await dbGet(id);
        if(data){setOpp(data);setScreen("opp");}
        else setScreen("home");
      } else {
        const ids=LS.get(KEYS.MY_IDS)||[];
        const list=await dbList(ids);
        setMyOpps(list);
        setScreen("home");
      }
    };
    init();
    const t=setInterval(()=>setNow(new Date()),30000);
    return()=>clearInterval(t);
  },[]);

  const showToast=msg=>{setToast(msg);clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(null),2500);};
  const saveRests=l=>{setRests(l);LS.set(KEYS.RESTS,l);};
  const saveNames=l=>{setNames(l);LS.set(KEYS.NAMES,l);};

  const onCreated=async(newOpp,pin,newR)=>{
    if(newR&&!rests.includes(newR)) saveRests([...rests,newR]);
    await dbCreate(newOpp);
    const ids=LS.get(KEYS.MY_IDS)||[];
    LS.set(KEYS.MY_IDS,[newOpp.id,...ids]);
    saveOppPin(newOpp.id,pin);
    setMyOpps(prev=>[newOpp,...prev]);
    setOpp(newOpp);
    setUrlId(newOpp.id);
    setScreen("opp");
  };

  const updateOpp=async updated=>{
    setOpp(updated);
    await dbUpdate(updated);
  };

  const goHome=()=>{
    clearUrl();setOpp(null);
    const ids=LS.get(KEYS.MY_IDS)||[];
    dbList(ids).then(list=>setMyOpps(list));
    setScreen("home");
  };

  if(screen==="loading") return <Loading/>;
  return(
    <div style={{maxWidth:480,margin:"0 auto",minHeight:"100vh",background:"#F5EFE0",position:"relative"}}>
      {toast&&<Toast msg={toast}/>}
      {screen==="home"&&<HomeScreen now={now} myOpps={myOpps} onNew={()=>setScreen("create")} onOpen={o=>{setOpp(o);setUrlId(o.id);setScreen("opp");}}/>}
      {screen==="create"&&<CreateScreen rests={rests} names={names} onBack={()=>setScreen("home")} onCreated={onCreated}/>}
      {screen==="opp"&&opp&&<OppScreen opp={opp} names={names} onBack={goHome} onUpdate={updateOpp} onInvoice={()=>setScreen("invoice")} saveNames={saveNames} showToast={showToast}/>}
      {screen==="invoice"&&opp&&<InvoiceScreen opp={opp} onBack={()=>setScreen("opp")} onUpdate={updateOpp}/>}
    </div>
  );
}

// ── Home ──────────────────────────────────────────────────────────────────
function HomeScreen({now,myOpps,onNew,onOpen}){
  const active=myOpps.filter(o=>!o.closed);
  const closed=myOpps.filter(o=>o.closed);
  return(
    <div className="screen">
      <div style={{background:DARK,padding:"28px 20px 24px",display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:44,height:44,background:CLAY,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:700,color:"#fff",flexShrink:0}}>س</div>
        <h1 style={{fontSize:26,fontWeight:700,color:"#fff",margin:0}}>سَهالات</h1>
        <div style={{marginRight:"auto",textAlign:"left"}}>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.55)",marginBottom:2}}>{fmtDate(now)}</div>
          <div style={{fontSize:17,fontWeight:600,color:CLAY}}>{fmtTime(now)}</div>
        </div>
      </div>
      <button onClick={onNew} style={{display:"flex",alignItems:"center",gap:8,background:CLAY,color:"#fff",border:"none",borderRadius:14,padding:"14px 20px",fontSize:15,fontWeight:700,width:"calc(100% - 32px)",margin:"16px 16px 0",cursor:"pointer",justifyContent:"center",boxShadow:"0 4px 14px rgba(196,149,106,0.35)",fontFamily:"inherit"}}>
        {Ico.plus}<span>فرصة طلب جديدة</span>
      </button>
      {myOpps.length===0&&(
        <div style={{textAlign:"center",padding:"56px 20px"}}>
          <div style={{fontSize:44,marginBottom:14}}>🍽️</div>
          <p style={{fontSize:15,color:ACCENT,margin:0,fontWeight:600}}>لا توجد فرص طلب حتى الآن</p>
          <p style={{fontSize:13,color:"#aaa",marginTop:6}}>أنشئ فرصة وشاركها مع المجلس</p>
        </div>
      )}
      {active.length>0&&(
        <div style={{padding:"20px 16px 0"}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:ACCENT,marginBottom:10}}>مفتوحة</div>
          {active.map(o=><OppCard key={o.id} opp={o} onClick={()=>onOpen(o)}/>)}
        </div>
      )}
      {closed.length>0&&(
        <div style={{padding:"12px 16px 0"}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:ACCENT,marginBottom:10,opacity:0.5}}>مغلقة</div>
          {closed.map(o=><OppCard key={o.id} opp={o} onClick={()=>onOpen(o)} closed/>)}
        </div>
      )}
    </div>
  );
}
function OppCard({opp,onClick,closed}){
  const people=opp.orders.length;
  const total=opp.orders.reduce((s,o)=>s+o.items.length,0);
  return(
    <div className="opp-card" onClick={onClick} style={{background:CARD,border:"1px solid "+BORDER,borderRadius:16,padding:"14px 16px",marginBottom:10,boxShadow:"0 2px 8px rgba(28,20,16,0.06)",opacity:closed?0.6:1}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"center",gap:6,fontWeight:700,fontSize:15,color:DARK}}>{Ico.rest}<span>{opp.restaurant}</span></div>
        {closed&&<span style={{background:"#eee",color:"#888",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>مغلقة</span>}
      </div>
      <div style={{display:"flex",gap:14,marginBottom:6}}>
        <span style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:ACCENT}}>{Ico.usr}<span>{people} شخص</span></span>
        <span style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:ACCENT}}>{Ico.rcpt}<span>{total} مادة</span></span>
        <span style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:ACCENT}}>{Ico.clock}<span>{opp.suggestedTime}</span></span>
      </div>
      <div style={{fontSize:11,color:"#999"}}>بواسطة {opp.creator}</div>
    </div>
  );
}

// ── Create ────────────────────────────────────────────────────────────────
function CreateScreen({rests,names,onBack,onCreated}){
  const [creator,setCreator]=useState("");
  const [rest,setRest]      =useState("");
  const [customR,setCustomR]=useState("");
  const [showNew,setShowNew]=useState(false);
  const [pin,setPin]        =useState("");
  const [loading,setLoading]=useState(false);
  const [time,setTime]      =useState(()=>{
    const d=new Date();d.setMinutes(d.getMinutes()+30);
    return d.toTimeString().slice(0,5);
  });
  const useCustom=showNew||rests.length===0;
  const restVal=useCustom?customR:rest;
  const valid=creator.trim()&&restVal.trim()&&time&&pin.length>=4&&!loading;

  const submit=async()=>{
    if(!valid) return;
    setLoading(true);
    try{
      await onCreated({
        id:uid(),creator:creator.trim(),restaurant:restVal.trim(),
        suggestedTime:time,createdAt:Date.now(),
        orders:[],closed:false,paymentMethod:"equal",
        pinHash:btoa(pin)
      },pin,useCustom?restVal.trim():null);
    }catch(e){alert("حدث خطأ أثناء الحفظ");}
    setLoading(false);
  };

  return(
    <div className="screen">
      <TopBar onBack={onBack} title="فرصة طلب جديدة"/>
      <div style={{padding:"20px 16px"}}>
        <Field label="اسمك">
          <input style={inp} placeholder="اكتب اسمك" value={creator} onChange={e=>setCreator(e.target.value)} list="dl-c-names"/>
          <datalist id="dl-c-names">{names.map(n=><option key={n} value={n}/>)}</datalist>
        </Field>
        <Field label="المطعم">
          {rests.length>0&&!showNew&&(
            <select style={{...inp,marginBottom:6}} value={rest} onChange={e=>setRest(e.target.value)}>
              <option value="">اختر مطعمًا</option>
              {rests.map(r=><option key={r} value={r}>{r}</option>)}
            </select>
          )}
          {useCustom&&<input style={inp} placeholder="اسم المطعم" value={customR} onChange={e=>setCustomR(e.target.value)}/>}
          {rests.length>0&&(
            <button onClick={()=>{setShowNew(!showNew);setRest("");setCustomR("");}} style={{background:"none",border:"none",color:CLAY,fontSize:13,cursor:"pointer",padding:"4px 0",fontWeight:600,fontFamily:"inherit",marginTop:6,display:"block"}}>
              {showNew?"← اختر من المحفوظة":"+ أضف مطعم جديد"}
            </button>
          )}
        </Field>
        <Field label="الوقت المقترح">
          <input style={inp} type="time" value={time} onChange={e=>setTime(e.target.value)}/>
        </Field>
        <Field label="رمز الإقفال (4 أرقام على الأقل)">
          <input style={{...inp,letterSpacing:6,textAlign:"center"}} type="password" maxLength={6} placeholder="اختر رمزاً سرياً" value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,""))}/>
          <div style={{fontSize:11,color:"#aaa",marginTop:4}}>هذا الرمز يمكّنك فقط من إقفال الفرصة لاحقاً</div>
        </Field>
        <Btn onClick={submit} disabled={!valid} loading={loading}>إنشاء الفرصة</Btn>
      </div>
    </div>
  );
}

// ── Opportunity ───────────────────────────────────────────────────────────
function OppScreen({opp,names,onBack,onUpdate,onInvoice,saveNames,showToast}){
  const [tab,setTab]        =useState("summary");
  const [uname,setUname]    =useState("");
  const [items,setItems]    =useState([{id:uid(),name:"",custom:""}]);
  const [saving,setSaving]  =useState(false);
  const [pinModal,setPinModal]=useState(false);
  const [pinError,setPinError]=useState("");
  const isCreator           =amICreator(opp.id);
  const restItems           =getRestItems(opp.restaurant);

  // Build summary
  const summary={};
  opp.orders.forEach(o=>o.items.forEach(i=>{summary[i.name]=(summary[i.name]||0)+1;}));

  const shareWA=()=>{
    const url=pageUrl(opp.id);
    const text="🍽️ فرصة طلب من "+opp.restaurant+"\n⏰ الوقت المقترح: "+opp.suggestedTime+"\n👤 المنشئ: "+opp.creator+"\n\nاضغط الرابط لإضافة طلبك 👇\n"+url;
    window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
  };

  const addOrder=async()=>{
    if(!uname.trim()||items.every(i=>!i.name.trim())) return;
    setSaving(true);
    const valid=items.filter(i=>i.name.trim()).map(i=>({id:i.id,name:i.name.trim(),customization:i.custom.trim(),price:""}));
    const updated={...opp,orders:[...opp.orders,{id:uid(),person:uname.trim(),items:valid}]};
    try{
      await onUpdate(updated);
      if(!names.includes(uname.trim())) saveNames([...names,uname.trim()]);
      // Save items per restaurant
      valid.forEach(i=>saveRestItem(opp.restaurant,i.name));
      setUname("");setItems([{id:uid(),name:"",custom:""}]);
      setTab("summary");
      showToast("تم إضافة طلبك ✓");
    }catch(e){showToast("حدث خطأ، حاول مجدداً");}
    setSaving(false);
  };

  const rmOrder=async id=>{
    try{await onUpdate({...opp,orders:opp.orders.filter(o=>o.id!==id)});showToast("تم الحذف");}
    catch(e){showToast("حدث خطأ");}
  };

  const tryClose=()=>{
    if(isCreator){
      // Already verified creator on this device
      doClose();
    } else {
      setPinModal(true);
      setPinError("");
    }
  };

  const doClose=async()=>{
    try{await onUpdate({...opp,closed:true});showToast("تم إقفال الفرصة");}
    catch(e){showToast("حدث خطأ");}
  };

  const confirmPin=(entered)=>{
    if(btoa(entered)===opp.pinHash){
      saveOppPin(opp.id,entered);
      setPinModal(false);
      doClose();
    } else {
      setPinError("الرمز غير صحيح");
    }
  };

  const setItem=(idx,field,val)=>{const cp=[...items];cp[idx]={...cp[idx],[field]:val};setItems(cp);};
  const canAdd=uname.trim()&&items.some(i=>i.name.trim());

  return(
    <div className="screen">
      {pinModal&&<PinModal title="إقفال الفرصة" onConfirm={confirmPin} onCancel={()=>setPinModal(false)} error={pinError}/>}
      <TopBar onBack={onBack} title={opp.restaurant} sub={"⏰ "+opp.suggestedTime+" · بواسطة "+opp.creator}
        right={opp.closed?<span style={{background:"#333",color:"#aaa",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20,whiteSpace:"nowrap",flexShrink:0}}>مغلقة</span>:null}/>

      <div style={{display:"flex",gap:8,padding:"14px 16px 0"}}>
        <button onClick={shareWA} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:WA,color:"#fff",border:"none",borderRadius:12,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 3px 10px rgba(37,211,102,0.3)"}}>
          {Ico.share}<span>مشاركة واتساب</span>
        </button>
        {opp.orders.length>0&&(
          <button onClick={onInvoice} style={{display:"flex",alignItems:"center",gap:6,background:CARD,color:DARK,border:"1.5px solid "+BORDER,borderRadius:12,padding:"11px 14px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {Ico.rcpt}<span>الفاتورة</span>
          </button>
        )}
      </div>

      <div style={{display:"flex",padding:"14px 16px 0",borderBottom:"1px solid "+BORDER}}>
        <button onClick={()=>setTab("summary")} style={{flex:1,padding:"10px",background:"none",border:"none",borderBottom:"2px solid "+(tab==="summary"?CLAY:"transparent"),fontSize:13,fontWeight:600,color:tab==="summary"?DARK:"#aaa",cursor:"pointer",fontFamily:"inherit"}}>
          ملخص الطلبات
        </button>
        {!opp.closed&&(
          <button onClick={()=>setTab("add")} style={{flex:1,padding:"10px",background:"none",border:"none",borderBottom:"2px solid "+(tab==="add"?CLAY:"transparent"),fontSize:13,fontWeight:600,color:tab==="add"?DARK:"#aaa",cursor:"pointer",fontFamily:"inherit"}}>
            + أضف طلبك
          </button>
        )}
      </div>

      {tab==="summary"&&(
        <div>
          {/* ── إجمالي المواد ── */}
          {Object.keys(summary).length>0&&(
            <div style={{background:DARK,borderRadius:16,margin:"16px 16px 0",padding:"16px"}}>
              <div style={{fontSize:12,fontWeight:700,color:CLAY,marginBottom:10,letterSpacing:0.5}}>إجمالي المواد للطلب</div>
              {Object.entries(summary).map(([name,count])=>(
                <div key={name} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
                  <span style={{fontSize:14,color:"#fff",fontWeight:500}}>{name}</span>
                  <span style={{fontSize:16,fontWeight:700,color:CLAY}}>× {count}</span>
                </div>
              ))}
              <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",marginTop:10,textAlign:"center"}}>
                {opp.orders.length} شخص · {opp.orders.reduce((s,o)=>s+o.items.length,0)} مادة
              </div>
            </div>
          )}

          {opp.orders.length===0&&(
            <div style={{textAlign:"center",padding:"32px 20px"}}>
              <p style={{color:ACCENT,fontWeight:600,margin:0}}>لا يوجد طلبات حتى الآن</p>
              <p style={{color:"#aaa",fontSize:13,marginTop:6}}>شارك الرابط ليضيف الأعضاء طلباتهم</p>
            </div>
          )}

          {/* ── تفصيل الأشخاص ── */}
          {opp.orders.length>0&&(
            <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:ACCENT,padding:"16px 16px 8px"}}>تفصيل الأشخاص</div>
          )}
          {opp.orders.map(order=>(
            <div key={order.id} style={{background:CARD,border:"1px solid "+BORDER,borderRadius:14,margin:"0 16px 10px",padding:"12px 14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{display:"flex",alignItems:"center",gap:6,fontSize:14,fontWeight:700,color:DARK}}>{Ico.usr} {order.person}</span>
                {!opp.closed&&isCreator&&(
                  <button onClick={()=>rmOrder(order.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#ccc",padding:4,display:"flex",borderRadius:6}}>{Ico.trash}</button>
                )}
              </div>
              {order.items.map(item=>(
                <div key={item.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",fontSize:13,color:"#555"}}>
                  <span style={{fontWeight:500}}>{item.name}</span>
                  {item.customization&&<span style={{color:"#999",fontSize:12}}>({item.customization})</span>}
                  {item.price&&<span style={{marginRight:"auto",color:GREEN,fontWeight:700,fontSize:12}}>{item.price} ر.س</span>}
                </div>
              ))}
            </div>
          ))}

          {!opp.closed&&(
            <button onClick={tryClose} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"none",border:"1.5px solid "+BORDER,borderRadius:12,padding:"11px",fontSize:13,fontWeight:600,color:"#888",cursor:"pointer",fontFamily:"inherit",width:"calc(100% - 32px)",margin:"8px 16px 0"}}>
              {Ico.lock} إقفال الفرصة
            </button>
          )}
        </div>
      )}

      {tab==="add"&&!opp.closed&&(
        <div style={{padding:"20px 16px"}}>
          <Field label="اسمك">
            <input style={inp} placeholder="اكتب اسمك" value={uname} onChange={e=>setUname(e.target.value)} list="dl-a-names"/>
            <datalist id="dl-a-names">{names.map(n=><option key={n} value={n}/>)}</datalist>
          </Field>
          <div style={{fontSize:13,fontWeight:600,color:ACCENT,marginBottom:8}}>مواد الطلب</div>
          {items.map((item,idx)=>(
            <div key={item.id} style={{marginBottom:10}}>
              <div style={{display:"flex",gap:8}}>
                <input style={{...inp,flex:1}} placeholder={"مادة "+(idx+1)} value={item.name} list={"dl-ritems-"+idx}
                  onChange={e=>setItem(idx,"name",e.target.value)}/>
                <input style={{...inp,flex:1}} placeholder="تخصيص — مثل: بدون شطة" value={item.custom}
                  onChange={e=>setItem(idx,"custom",e.target.value)}/>
                {items.length>1&&<button onClick={()=>setItems(items.filter((_,i)=>i!==idx))} style={{background:"none",border:"none",cursor:"pointer",color:"#ccc",padding:4,display:"flex",flexShrink:0,alignItems:"center"}}>{Ico.trash}</button>}
              </div>
              <datalist id={"dl-ritems-"+idx}>{restItems.map(n=><option key={n} value={n}/>)}</datalist>
            </div>
          ))}
          <button onClick={()=>setItems([...items,{id:uid(),name:"",custom:""}])} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"1.5px dashed "+BORDER,borderRadius:12,padding:"10px 16px",fontSize:13,fontWeight:600,color:CLAY,cursor:"pointer",fontFamily:"inherit",width:"100%",justifyContent:"center",marginBottom:4}}>
            {Ico.plus} أضف مادة
          </button>
          <Btn onClick={addOrder} disabled={!canAdd} loading={saving}>حفظ الطلب</Btn>
        </div>
      )}
    </div>
  );
}

// ── Invoice ───────────────────────────────────────────────────────────────
function InvoiceScreen({opp,onBack,onUpdate}){
  const [method,setMethod]=useState(opp.paymentMethod||"equal");
  const [prices,setPrices]=useState(()=>{
    const m={};
    opp.orders.forEach(o=>o.items.forEach(i=>{if(!m[i.name])m[i.name]=i.price||"";}));
    return m;
  });
  const [saving,setSaving]=useState(false);

  const allNames=[...new Set(opp.orders.flatMap(o=>o.items.map(i=>i.name)))];
  const getTotal=order=>order.items.reduce((s,i)=>s+(parseFloat(prices[i.name]||0)),0);
  const grand=opp.orders.reduce((s,o)=>s+getTotal(o),0);
  const share=opp.orders.length>0?grand/opp.orders.length:0;

  const save=async()=>{
    setSaving(true);
    const updated={...opp,paymentMethod:method,orders:opp.orders.map(o=>({...o,items:o.items.map(i=>({...i,price:prices[i.name]||""}))}))} ;
    await onUpdate(updated);
    setSaving(false);
  };

  return(
    <div className="screen">
      <TopBar onBack={onBack} title={"الفاتورة — "+opp.restaurant}/>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:600,color:ACCENT}}>طريقة القطة:</span>
        <div style={{display:"flex",gap:8}}>
          {[["equal","بالتساوي"],["individual","كل حسب طلبه"]].map(([v,l])=>(
            <button key={v} onClick={()=>setMethod(v)} style={{display:"flex",alignItems:"center",gap:4,background:method===v?DARK:CARD,color:method===v?"#fff":"#888",border:"1.5px solid "+(method===v?DARK:BORDER),borderRadius:10,padding:"8px 14px",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s"}}>
              {method===v&&Ico.chk} {l}
            </button>
          ))}
        </div>
      </div>
      {allNames.length>0&&(
        <div style={{padding:"16px 16px 0"}}>
          <div style={{fontSize:11,fontWeight:700,color:ACCENT,marginBottom:10,letterSpacing:1}}>أسعار المواد (اختياري)</div>
          {allNames.map(name=>(
            <div key={name} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid "+BORDER}}>
              <span style={{flex:1,fontSize:14,fontWeight:500}}>{name}</span>
              <input type="number" min="0" style={{width:70,padding:"7px 10px",borderRadius:8,border:"1.5px solid "+BORDER,background:CARD,fontSize:13,textAlign:"center",fontFamily:"inherit",color:DARK,outline:"none"}} placeholder="السعر" value={prices[name]||""} onChange={e=>setPrices({...prices,[name]:e.target.value})}/>
              <span style={{fontSize:12,color:"#888",flexShrink:0}}>ر.س</span>
            </div>
          ))}
        </div>
      )}
      <div style={{padding:"0 16px"}}>
        <Btn onClick={save} loading={saving}>حفظ الأسعار</Btn>
      </div>
      <div style={{fontSize:11,fontWeight:700,color:ACCENT,padding:"20px 16px 8px",letterSpacing:1}}>تفصيل الأشخاص</div>
      {opp.orders.map(order=>{
        const total=getTotal(order);
        const due=method==="equal"?share:total;
        return(
          <div key={order.id} style={{background:CARD,border:"1px solid "+BORDER,borderRadius:14,margin:"0 16px 10px",padding:"12px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{display:"flex",alignItems:"center",gap:6,fontSize:14,fontWeight:700,color:DARK}}>{Ico.usr} {order.person}</span>
              {due>0&&<span style={{fontSize:15,fontWeight:700,color:GREEN}}>{due.toFixed(2)} ر.س</span>}
            </div>
            {order.items.map(item=>(
              <div key={item.id} style={{display:"flex",alignItems:"center",fontSize:13,color:"#555",padding:"3px 0",gap:6}}>
                <span style={{fontWeight:500}}>{item.name}</span>
                {item.customization&&<span style={{color:"#999",fontSize:12}}>({item.customization})</span>}
                {prices[item.name]&&<span style={{marginRight:"auto",color:GREEN,fontWeight:700,fontSize:12}}>{prices[item.name]} ر.س</span>}
              </div>
            ))}
          </div>
        );
      })}
      {grand>0&&<div style={{textAlign:"center",padding:"20px",fontSize:16,color:DARK,borderTop:"1px solid "+BORDER,marginTop:8}}>الإجمالي: <strong>{grand.toFixed(2)} ر.س</strong></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
