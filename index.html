// ── Fuzzy matching ────────────────────────────────────────────────────────
// Levenshtein distance
function levDist(a,b){
  a=a.trim().toLowerCase();b=b.trim().toLowerCase();
  if(a===b) return 0;
  if(!a.length) return b.length;
  if(!b.length) return a.length;
  const dp=Array.from({length:a.length+1},(_,i)=>Array.from({length:b.length+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[a.length][b.length];
}
// Returns similarity 0-1
function similarity(a,b){
  if(!a||!b) return 0;
  const maxLen=Math.max(a.length,b.length);
  return maxLen===0?1:(1-levDist(a,b)/maxLen);
}
// Find best match in list above threshold
function findFuzzyMatch(input,candidates,threshold=0.65){
  if(!input||input.length<2) return null;
  let best=null,bestScore=0;
  candidates.forEach(c=>{
    const s=similarity(input,c);
    if(s>bestScore&&s>=threshold&&c.toLowerCase()!==input.toLowerCase()){bestScore=s;best=c;}
  });
  return best?{match:best,score:bestScore}:null;
}

// Week stats (Sunday-start)
function getWeekStart(){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-d.getDay()); // Sunday
  return d.getTime();
}
function calcWeekStats(opps){
  const ws=getWeekStart();
  const weekly=opps.filter(o=>o.createdAt>=ws);
  // Top restaurant
  const restCount={};
  weekly.filter(o=>o.type!=="cook").forEach(o=>{restCount[o.restaurant]=(restCount[o.restaurant]||0)+1;});
  const topRest=Object.entries(restCount).sort((a,b)=>b[1]-a[1])[0]||null;
  // Total spent
  let total=0;
  weekly.forEach(o=>{
    if(o.type==="cook"&&o.totalCost) total+=parseFloat(o.totalCost)||0;
    else o.orders&&o.orders.forEach(ord=>ord.items&&ord.items.forEach(i=>{
      if(i.price) total+=(parseFloat(i.price)||0)*(i.qty||1);
    }));
  });
  return {topRest,total,count:weekly.length};
}

function getOppItemNames(opp){const ns=[];(opp.orders||[]).forEach(o=>(o.items||[]).forEach(i=>{if(!ns.map(x=>x.toLowerCase()).includes(i.name.toLowerCase()))ns.push(i.name);}));return ns;}

function buildSummary(orders){

    map[k]=(map[k]||0)+(i.qty||1);
  }));
  return map;
}

// Is registration closed for cook event?
function isCookRegClosed(opp){
  if(!opp.deadline) return false;
  const [h,m]=opp.deadline.split(":").map(Number);
  const dl=new Date(); dl.setHours(h,m,0,0);
  return new Date()>dl;
}

// ── App ───────────────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState("loading");
  const [opp,setOpp]      =useState(null);
  const [myOpps,setMyOpps]=useState([]);
  const [rests,setRests]  =useState(()=>LS.get(KEYS.RESTS)||[]);
  const [names,setNames]  =useState(()=>LS.get(KEYS.NAMES)||[]);
  const [now,setNow]      =useState(new Date());
  const [toast,setToast]  =useState(null);
  const toastRef          =useRef(null);

  // Keep a ref to current opp id so the realtime callback can read it
  const oppIdRef=useRef(null);
  const screenRef=useRef("loading");

  useEffect(()=>{
    const init=async()=>{
      const id=getUrlId();
      if(id){
        const data=await dbGet(id);
        if(data){
          setOpp(data);
          oppIdRef.current=id;
          const sc=data.type==="cook"?"cook":"opp";
          screenRef.current=sc;
          setScreen(sc);
        } else setScreen("home");
      } else {
        const ids=LS.get(KEYS.MY_IDS)||[];
        const list=await dbList(ids);
        setMyOpps(list);
        setScreen("home");
      }
    };
    init();

    // Realtime subscription — fires whenever any row in opportunities changes
    const channel=sb.channel("opp-changes")
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"opportunities"},(payload)=>{
        const updated=payload.new&&payload.new.data;
        if(!updated) return;
        // Update current open opp if it matches
        if(oppIdRef.current&&updated.id===oppIdRef.current){
          setOpp(updated);
        }
        // Update myOpps list if this opp is in it
        setMyOpps(prev=>{
          const idx=prev.findIndex(o=>o.id===updated.id);
          if(idx===-1) return prev;
          const copy=[...prev];copy[idx]=updated;return copy;
        });
      })
      .subscribe();

    const t=setInterval(()=>setNow(new Date()),30000);
    return()=>{clearInterval(t);sb.removeChannel(channel);};
  },[]);

  const showToast=msg=>{setToast(msg);clearTimeout(toastRef.current);toastRef.current=setTimeout(()=>setToast(null),2500);};
  const saveRests=l=>{setRests(l);LS.set(KEYS.RESTS,l);};
  const saveNames=l=>{setNames(l);LS.set(KEYS.NAMES,l);};

  const onCreated=async(newOpp,pin,newR)=>{
    if(newR&&!rests.includes(newR)) saveRests([...rests,newR]);
    await dbCreate(newOpp);
    const ids=LS.get(KEYS.MY_IDS)||[];
    LS.set(KEYS.MY_IDS,[newOpp.id,...ids]);
    saveOppPin(newOpp.id,pin);
    setMyOpps(prev=>[newOpp,...prev]);
    setOpp(newOpp);setUrlId(newOpp.id);
    setScreen(newOpp.type==="cook"?"cook":"opp");
  };

  const updateOpp=async updated=>{
    setOpp(updated);
    oppIdRef.current=updated.id;
    await dbUpdate(updated);
  };
  const goHome=()=>{clearUrl();setOpp(null);oppIdRef.current=null;const ids=LS.get(KEYS.MY_IDS)||[];dbList(ids).then(l=>setMyOpps(l));setScreen("home");};

  const stats=calcWeekStats(myOpps);

  if(screen==="loading") return <Loading/>;
  return(
    <div style={{maxWidth:480,margin:"0 auto",minHeight:"100vh",background:"#F5EFE0",position:"relative"}}>
      {toast&&<Toast msg={toast}/>}
      {screen==="home"&&<HomeScreen now={now} myOpps={myOpps} stats={stats} onNewOrder={()=>setScreen("create-order")} onNewCook={()=>setScreen("create-cook")} onOpen={o=>{setOpp(o);setUrlId(o.id);setScreen(o.type==="cook"?"cook":"opp");}}/>}
      {screen==="create-order"&&<CreateOrderScreen rests={rests} names={names} onBack={()=>setScreen("home")} onCreated={onCreated}/>}
      {screen==="create-cook"&&<CreateCookScreen names={names} onBack={()=>setScreen("home")} onCreated={onCreated}/>}
      {screen==="opp"&&opp&&<OppScreen opp={opp} names={names} onBack={goHome} onUpdate={updateOpp} onInvoice={()=>setScreen("invoice")} saveNames={saveNames} showToast={showToast}/>}
      {screen==="cook"&&opp&&<CookScreen opp={opp} names={names} onBack={goHome} onUpdate={updateOpp} saveNames={saveNames} showToast={showToast}/>}
      {screen==="invoice"&&opp&&<InvoiceScreen opp={opp} onBack={()=>setScreen("opp")} onUpdate={updateOpp}/>}
    </div>
  );
}

  const active=myOpps.filter(o=>!o.closed);

  return(

        <div style={{width:44,height:44,background:CLAY,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:700,color:"#fff",flexShrink:0}}>س</div>
        <h1 style={{fontSize:26,fontWeight:700,color:"#fff",margin:0}}>سَهالات</h1>
        <div style={{marginRight:"auto",textAlign:"left"}}>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.55)",marginBottom:2}}>{fmtDate(now)}</div>
          <div style={{fontSize:17,fontWeight:600,color:CLAY}}>{fmtTime(now)}</div>
        </div>
      </div>

      {/* Week stats */}
      {(stats.topRest||stats.total>0)&&(
        <div style={{margin:"14px 16px 0",background:DARK,borderRadius:16,padding:"14px 16px",display:"flex",gap:12}}>

function CreateOrderScreen({rests,names,onBack,onCreated}){

  const [customR,setCustomR]=useState("");
  const [showNew,setShowNew]=useState(false);
  const [pin,setPin]        =useState("");

function CookScreen({opp,names,onBack,onUpdate,saveNames,showToast}){
  const [uname,setUname]     =useState("");
  const [saving,setSaving]   =useState(false);
  const [pinModal,setPinModal]=useState(false);
  const [pinError,setPinError]=useState(false);
  const [costInput,setCostInput]=useState(opp.totalCost||"");
  const [showCost,setShowCost]=useState(false);
  const isCreator            =amICreator(opp.id);
  const regClosed            =isCookRegClosed(opp)||opp.closed;
  const participants         =opp.participants||[];
  const alreadyIn            =uname.trim()&&participants.map(p=>p.toLowerCase()).includes(uname.trim().toLowerCase());

  const shareWA=()=>{
    const url=pageUrl(opp.id);
    const text="🍽️ طبخ في المجلس: "+opp.mealName+"\n⏰ الوقت المقترح: "+opp.suggestedTime+"\n⏳ آخر وقت للتسجيل: "+opp.deadline+"\n👨‍🍳 الطباخ: "+opp.creator+"\n\nسجّل اسمك للمشاركة 👇\n"+url;
    window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
  };

  const join=async()=>{
    if(!uname.trim()||alreadyIn||regClosed) return;
    setSaving(true);
    try{
      // Fetch latest to avoid overwriting concurrent joins
      const latest=await dbGet(opp.id)||opp;
      const updated={...latest,participants:[...(latest.participants||[]),uname.trim()]};
      await onUpdate(updated);
      if(!names.includes(uname.trim())) saveNames([...names,uname.trim()]);
      setUname("");showToast("تم تسجيل اسمك ✓");
    }catch(e){showToast("حدث خطأ");}
    setSaving(false);
  };

  const tryClose=()=>{if(isCreator){setShowCost(true);}else{setPinModal(true);setPinError("");}};
  const confirmPin=(entered)=>{
    if(btoa(entered)===opp.pinHash){saveOppPin(opp.id,entered);setPinModal(false);setShowCost(true);}
    else setPinError("الرمز غير صحيح");
  };
  const doClose=async()=>{
    try{
      await onUpdate({...opp,closed:true,totalCost:costInput});
      showToast("تم إقفال الفرصة");setShowCost(false);
    }catch(e){showToast("حدث خطأ");}
  };

  const share=participants.length>0&&opp.totalCost?(parseFloat(opp.totalCost)/participants.length).toFixed(2):null;

  return(
    <div className="screen">
      {pinModal&&<PinModal onConfirm={confirmPin} onCancel={()=>setPinModal(false)} error={pinError?"الرمز غير صحيح":null}/>}
      {showCost&&(
        <div className="modal-bg">
          <div className="modal">
            <div style={{fontSize:16,fontWeight:700,color:DARK,marginBottom:6}}>إقفال فرصة الطبخ</div>
            <div style={{fontSize:13,color:"#888",marginBottom:12}}>أدخل المبلغ الإجمالي المصروف (اختياري)</div>
            <input style={{...inp,textAlign:"center",fontSize:18}} type="number" min="0" placeholder="المبلغ بالريال" value={costInput} onChange={e=>setCostInput(e.target.value)}/>
            <Btn onClick={doClose} color={COOK}>إقفال الفرصة</Btn>
            <button onClick={()=>setShowCost(false)} style={{width:"100%",marginTop:8,padding:"10px",background:"none",border:"none",color:"#aaa",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>إلغاء</button>
          </div>
        </div>
      )}

      <TopBar onBack={onBack} title={opp.mealName} sub={"⏰ "+opp.suggestedTime+" · الطباخ: "+opp.creator}
        right={opp.closed
          ?<span style={{background:"#333",color:"#aaa",fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20,whiteSpace:"nowrap",flexShrink:0}}>مغلقة</span>
          :<span style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}><span className="live-dot"/><span style={{fontSize:10,color:"rgba(255,255,255,0.5)"}}>مباشر</span></span>
        }/>

      <div style={{padding:"14px 16px 0",display:"flex",gap:8}}>
        <button onClick={shareWA} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:WA,color:"#fff",border:"none",borderRadius:12,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 3px 10px rgba(37,211,102,0.3)"}}>
          {Ico.share}<span>مشاركة واتساب</span>
        </button>
      </div>

      {/* Deadline notice */}
      <div style={{margin:"14px 16px 0",background:regClosed?"#fff0f0":COOK+"11",border:"1px solid "+(regClosed?"#fcc":COOK+"33"),borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:8}}>
        {Ico.clock}
        <span style={{fontSize:13,color:regClosed?"#c44":COOK,fontWeight:600}}>
          {regClosed?"انتهى وقت التسجيل":"آخر وقت للتسجيل: "+opp.deadline}
        </span>
      </div>

      {/* Participants */}
      <div style={{margin:"14px 16px 0",background:DARK,borderRadius:16,padding:"16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div style={{fontSize:12,fontWeight:700,color:COOK}}>المشاركون في الوجبة</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>{participants.length} شخص</div>
        </div>
        {participants.length===0&&<div style={{fontSize:13,color:"rgba(255,255,255,0.3)",textAlign:"center",padding:"8px 0"}}>لا يوجد مشاركون حتى الآن</div>}
        {participants.map((p,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
            <span style={{width:26,height:26,background:COOK+"44",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:COOK,flexShrink:0}}>{i+1}</span>
            <span style={{fontSize:14,color:"#fff"}}>{p}</span>
            {share&&<span style={{marginRight:"auto",fontSize:12,fontWeight:700,color:COOK}}>{share} ر.س</span>}
          </div>
        ))}
        {opp.totalCost&&(
          <div style={{marginTop:10,padding:"8px 0",borderTop:"1px solid rgba(255,255,255,0.1)",display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:13,color:"rgba(255,255,255,0.5)"}}>الإجمالي</span>
            <span style={{fontSize:14,fontWeight:700,color:"#fff"}}>{opp.totalCost} ر.س</span>
          </div>
        )}
      </div>

      {/* Join form */}
      {!regClosed&&!opp.closed&&(
        <div style={{padding:"16px 16px 0"}}>
          <div style={{fontSize:13,fontWeight:600,color:ACCENT,marginBottom:8}}>سجّل اسمك للمشاركة</div>
          <div style={{display:"flex",gap:8}}>
            <input style={{...inp,flex:1}} placeholder="اسمك" value={uname} onChange={e=>setUname(e.target.value)} list="dl-jn"/>
            <datalist id="dl-jn">{names.map(n=><option key={n} value={n}/>)}</datalist>
            <button onClick={join} disabled={!uname.trim()||alreadyIn||saving}
              style={{background:alreadyIn?"#eee":COOK,color:alreadyIn?"#aaa":"#fff",border:"none",borderRadius:12,padding:"0 16px",fontSize:13,fontWeight:700,cursor:(!uname.trim()||alreadyIn)?"not-allowed":"pointer",fontFamily:"inherit",flexShrink:0,display:"flex",alignItems:"center",gap:6}}>
              {saving?<span className="spin" style={{width:16,height:16}}/>:(alreadyIn?"مسجّل ✓":"تسجيل")}
            </button>
          </div>
        </div>
      )}

      {!opp.closed&&(
        <button onClick={tryClose} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"none",border:"1.5px solid "+BORDER,borderRadius:12,padding:"11px",fontSize:13,fontWeight:600,color:"#888",cursor:"pointer",fontFamily:"inherit",width:"calc(100% - 32px)",margin:"16px 16px 0"}}>
          {Ico.lock} إقفال الفرصة
        </button>
      )}
    </div>
  );
}

        </button>
        {(opp.orders||[]).length>0&&(
          <button onClick={onInvoice} style={{display:"flex",alignItems:"center",gap:6,background:CARD,color:DARK,border:"1.5px solid "+BORDER,borderRadius:12,padding:"11px 14px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
            {Ico.rcpt}<span>الفاتورة</span>
          </button>
        )}
      </div>

      <div style={{display:"flex",padding:"14px 16px 0",borderBottom:"1px solid "+BORDER}}>
        <button className="tab-btn" onClick={()=>setTab("summary")} style={{borderBottom:"2px solid "+(tab==="summary"?CLAY:"transparent"),color:tab==="summary"?DARK:"#aaa"}}>ملخص الطلبات</button>
        {!opp.closed&&<button className="tab-btn" onClick={()=>setTab("add")} style={{borderBottom:"2px solid "+(tab==="add"?CLAY:"transparent"),color:tab==="add"?DARK:"#aaa"}}>+ أضف طلبك</button>}
      </div>

      {tab==="summary"&&(
        <div>
          {Object.keys(summary).length>0&&(
            <div style={{background:DARK,borderRadius:16,margin:"16px 16px 0",padding:"16px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                <div style={{fontSize:12,fontWeight:700,color:CLAY}}>إجمالي المواد للطلب</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>{(opp.orders||[]).length} شخص · {totalQty} قطعة</div>
              </div>
              {Object.entries(summary).map(([key,count])=>{
                const [name,custom]=key.includes(" | ")?key.split(" | "):[key,""];
                return(
                  <div key={key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
                    <div><span style={{fontSize:14,color:"#fff",fontWeight:500}}>{name}</span>{custom&&<span style={{fontSize:12,color:"rgba(255,255,255,0.4)",marginRight:6}}>({custom})</span>}</div>
                    <span style={{fontSize:16,fontWeight:700,color:CLAY,flexShrink:0}}>× {count}</span>
                  </div>
                );
              })}
            </div>
          )}
          {(opp.orders||[]).length===0&&(<div style={{textAlign:"center",padding:"32px 20px"}}><p style={{color:ACCENT,fontWeight:600,margin:0}}>لا يوجد طلبات حتى الآن</p><p style={{color:"#aaa",fontSize:13,marginTop:6}}>شارك الرابط ليضيف الأعضاء طلباتهم</p></div>)}
          {(opp.orders||[]).length>0&&<div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:ACCENT,padding:"16px 16px 8px"}}>تفصيل الأشخاص</div>}
          {(opp.orders||[]).map(order=>(
            <div key={order.id} style={{background:CARD,border:"1px solid "+BORDER,borderRadius:14,margin:"0 16px 10px",padding:"12px 14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{display:"flex",alignItems:"center",gap:6,fontSize:14,fontWeight:700,color:DARK}}>{Ico.usr} {order.person}</span>
                {!opp.closed&&isCreator&&(<button onClick={()=>rmOrder(order.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#ccc",padding:4,display:"flex",borderRadius:6}}>{Ico.trash}</button>)}
              </div>
              {(order.items||[]).map(item=>(
                <div key={item.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",fontSize:13,color:"#555"}}>
                  {(item.qty||1)>1&&<span style={{background:CLAY,color:"#fff",fontSize:11,fontWeight:700,padding:"1px 6px",borderRadius:6,flexShrink:0}}>×{item.qty}</span>}
                  <span style={{fontWeight:500}}>{item.name}</span>
                  {item.customization&&<span style={{color:"#999",fontSize:12}}>({item.customization})</span>}
                  {item.price&&<span style={{marginRight:"auto",color:GREEN,fontWeight:700,fontSize:12}}>{item.price} ر.س</span>}
                </div>
              ))}
            </div>
          ))}
          {!opp.closed&&(<button onClick={tryClose} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"none",border:"1.5px solid "+BORDER,borderRadius:12,padding:"11px",fontSize:13,fontWeight:600,color:"#888",cursor:"pointer",fontFamily:"inherit",width:"calc(100% - 32px)",margin:"8px 16px 0"}}>{Ico.lock} إقفال الفرصة</button>)}
        </div>
      )}

      {tab==="add"&&!opp.closed&&(
        <div style={{padding:"20px 16px"}}>
          <Field label="اسمك"><input style={inp} placeholder="اكتب اسمك" value={uname} onChange={e=>setUname(e.target.value)} list="dl-an"/><datalist id="dl-an">{names.map(n=><option key={n} value={n}/>)}</datalist></Field>
          <div style={{fontSize:13,fontWeight:600,color:ACCENT,marginBottom:8}}>مواد الطلب</div>
          {items.map((item,idx)=>(
            <div key={item.id} style={{background:CARD,border:"1px solid "+BORDER,borderRadius:12,padding:"10px 12px",marginBottom:10}}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
                <ItemInput
                  value={item.name}
                  onChange={v=>setItem(idx,"name",v)}
                  suggestions={suggestions}
                  placeholder={"مادة "+(idx+1)}
                />
                {items.length>1&&<button onClick={()=>setItems(items.filter((_,i)=>i!==idx))} style={{background:"none",border:"none",cursor:"pointer",color:"#ccc",padding:4,display:"flex",flexShrink:0}}>{Ico.trash}</button>}
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <input style={{...inp,flex:1,padding:"9px 12px",fontSize:13}} placeholder="تخصيص — مثل: بدون شطة" value={item.custom} onChange={e=>setItem(idx,"custom",e.target.value)}/>
                <QtyControl value={item.qty||1} onChange={v=>setItem(idx,"qty",v)}/>
              </div>
            </div>
          ))}
          <button onClick={()=>setItems([...items,{id:uid(),name:"",custom:"",qty:1}])} style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"1.5px dashed "+BORDER,borderRadius:12,padding:"10px 16px",fontSize:13,fontWeight:600,color:CLAY,cursor:"pointer",fontFamily:"inherit",width:"100%",justifyContent:"center",marginBottom:4}}>
            {Ico.plus} أضف مادة
          </button>
          <Btn onClick={addOrder} disabled={!canAdd} loading={saving}>حفظ الطلب</Btn>
        </div>
      )}
    </div>
  );
}

// ── Invoice ───────────────────────────────────────────────────────────────
function InvoiceScreen({opp,onBack,onUpdate}){
  const [method,setMethod]=useState(opp.paymentMethod||"equal");
  const [prices,setPrices]=useState(()=>{const m={};(opp.orders||[]).forEach(o=>(o.items||[]).forEach(i=>{if(!m[i.name])m[i.name]=i.price||"";}));return m;});
  const [saving,setSaving]=useState(false);
  const allNames=[...new Set((opp.orders||[]).flatMap(o=>(o.items||[]).map(i=>i.name)))];
  const getTotal=order=>(order.items||[]).reduce((s,i)=>s+((parseFloat(prices[i.name]||0))*(i.qty||1)),0);
  const grand=(opp.orders||[]).reduce((s,o)=>s+getTotal(o),0);
  const share=(opp.orders||[]).length>0?grand/(opp.orders||[]).length:0;
  const save=async()=>{setSaving(true);await onUpdate({...opp,paymentMethod:method,orders:(opp.orders||[]).map(o=>({...o,items:(o.items||[]).map(i=>({...i,price:prices[i.name]||""}))}))} );setSaving(false);};
  return(
    <div className="screen">
      <TopBar onBack={onBack} title={"الفاتورة — "+opp.restaurant}/>
      <div style={{padding:"16px 16px 0",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:600,color:ACCENT}}>طريقة القطة:</span>
        <div style={{display:"flex",gap:8}}>
          {[["equal","بالتساوي"],["individual","كل حسب طلبه"]].map(([v,l])=>(
            <button key={v} onClick={()=>setMethod(v)} style={{display:"flex",alignItems:"center",gap:4,background:method===v?DARK:CARD,color:method===v?"#fff":"#888",border:"1.5px solid "+(method===v?DARK:BORDER),borderRadius:10,padding:"8px 14px",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
              {method===v&&Ico.chk} {l}
            </button>
          ))}
        </div>
      </div>
      {allNames.length>0&&(<div style={{padding:"16px 16px 0"}}><div style={{fontSize:11,fontWeight:700,color:ACCENT,marginBottom:10,letterSpacing:1}}>سعر الوحدة لكل مادة (اختياري)</div>{allNames.map(name=>(<div key={name} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid "+BORDER}}><span style={{flex:1,fontSize:14,fontWeight:500}}>{name}</span><input type="number" min="0" style={{width:70,padding:"7px 10px",borderRadius:8,border:"1.5px solid "+BORDER,background:CARD,fontSize:13,textAlign:"center",fontFamily:"inherit",color:DARK,outline:"none"}} placeholder="السعر" value={prices[name]||""} onChange={e=>setPrices({...prices,[name]:e.target.value})}/><span style={{fontSize:12,color:"#888",flexShrink:0}}>ر.س</span></div>))}</div>)}
      <div style={{padding:"0 16px"}}><Btn onClick={save} loading={saving}>حفظ الأسعار</Btn></div>
      <div style={{fontSize:11,fontWeight:700,color:ACCENT,padding:"20px 16px 8px",letterSpacing:1}}>تفصيل الأشخاص</div>
      {(opp.orders||[]).map(order=>{
        const total=getTotal(order);const due=method==="equal"?share:total;
        return(
          <div key={order.id} style={{background:CARD,border:"1px solid "+BORDER,borderRadius:14,margin:"0 16px 10px",padding:"12px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{display:"flex",alignItems:"center",gap:6,fontSize:14,fontWeight:700,color:DARK}}>{Ico.usr} {order.person}</span>
              {due>0&&<span style={{fontSize:15,fontWeight:700,color:GREEN}}>{due.toFixed(2)} ر.س</span>}
            </div>
            {(order.items||[]).map(item=>(
              <div key={item.id} style={{display:"flex",alignItems:"center",fontSize:13,color:"#555",padding:"3px 0",gap:6}}>
                {(item.qty||1)>1&&<span style={{background:"#eee",fontSize:11,fontWeight:700,padding:"1px 5px",borderRadius:5,flexShrink:0}}>×{item.qty}</span>}
                <span style={{fontWeight:500}}>{item.name}</span>
                {item.customization&&<span style={{color:"#999",fontSize:12}}>({item.customization})</span>}
                {prices[item.name]&&<span style={{marginRight:"auto",color:GREEN,fontWeight:700,fontSize:12}}>{((parseFloat(prices[item.name]))*(item.qty||1)).toFixed(2)} ر.س</span>}
              </div>
            ))}
          </div>
        );
      })}
      {grand>0&&<div style={{textAlign:"center",padding:"20px",fontSize:16,color:DARK,borderTop:"1px solid "+BORDER,marginTop:8}}>الإجمالي: <strong>{grand.toFixed(2)} ر.س</strong></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
